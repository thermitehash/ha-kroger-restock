# Kroger Restock wall scanner: M5Stack AtomS3 Lite + Atomic QRCode2 Base
#
# No soldering. The AtomS3 Lite (ESP32-S3) plugs onto the Atomic QRCode2
# Base (SKU A133-B, M14 scan engine). Each product barcode the base reads
# calls kroger_restock.scan_upc with source: esphome. The Atom's RGB LED
# shows the result (driven by esphome/ha_feedback_automation.yaml):
#   green = in cart (or quantity +1), amber = waiting on stock,
#   blue = needs review, red = unmatched / error,
#   amber double blink = ignored QR / non-product code (aim at the barcode).
# The base's own beep confirms each read.
#
# Built-in button: short press = print the list on the receipt printer,
#                  long press (1 s+) = sync the cart.
#
# IMPORTANT: after adopting the device in Home Assistant, open
#   Settings -> Devices & services -> ESPHome -> (this device) -> Configure
# and turn on "Allow the device to perform Home Assistant actions".
#
# Pin and protocol facts are from M5Stack's own driver code (UiFlow2
# qrcode2.py / qrcode_m14.py, M5Unified). See esphome/README.md.

substitutions:
  name: kroger-scanner
  friendly_name: Kroger Scanner
  # QRCode2 base on AtomS3: the base's TX is on G5, so the Atom RECEIVES on
  # GPIO5 and transmits on GPIO6. If nothing is ever read, swap these two.
  scanner_rx_pin: GPIO5
  scanner_tx_pin: GPIO6
  # M14 trigger mode sent at boot: 0x02 = auto (decodes continuously from
  # power-on), 0x05 = motion-sensing (wakes when something moves in front).
  scan_mode: "0x02"
  rgb_led_pin: GPIO35 # AtomS3 Lite WS2812-class LED (1 LED, GRB)
  button_pin: GPIO41 # AtomS3 Lite button, active low

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: kroger_restock.wall_scanner_atoms3
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      - delay: 2s # let the M14 finish booting
      - script.execute: configure_scanner

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret kroger_scanner_api_key
  actions:
    # Called by the Home Assistant automation on kroger_restock_scanned.
    # result: in_cart | duplicate | waiting | needs_review | unmatched |
    #         ignored | error
    - action: feedback
      variables:
        result: string
      then:
        - lambda: |-
            if (result == "in_cart" || result == "duplicate") {
              id(show_color).execute(0.0f, 1.0f, 0.0f);      // green
            } else if (result == "waiting") {
              id(show_color).execute(1.0f, 0.55f, 0.0f);     // amber
            } else if (result == "ignored") {
              id(blink_ignored).execute();
            } else if (result == "needs_review") {
              id(show_color).execute(0.0f, 0.3f, 1.0f);      // blue
            } else {
              id(show_color).execute(1.0f, 0.0f, 0.0f);      // red
            }

ota:
  # Updates are protected by the API encryption key above.
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret kroger_scanner_fallback_password

captive_portal:

uart:
  id: scanner_uart
  rx_pin: ${scanner_rx_pin}
  tx_pin: ${scanner_tx_pin}
  baud_rate: 115200
  # The M14 sends each decoded code as a burst of bytes; M5Stack's drivers
  # treat a short idle gap as the end of a code. The UART debugger with a
  # dummy receiver is a small line buffer: it hands over everything received
  # up to CR/LF or a 20 ms gap.
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r"
      timeout: 20ms
    sequence:
      - lambda: |-
          // Keep plain numeric codes (UPC, EAN, PLU). QR / Data Matrix codes
          // on packaging contain other characters and are ignored silently.
          // The M14's binary command acknowledgements (e.g. 22 61 41 ..) are
          // dropped by the same check.
          std::string code;
          for (uint8_t b : bytes) {
            if (b >= '0' && b <= '9') {
              code += static_cast<char>(b);
            } else if (b == '\r' || b == '\n' || b == ' ' || b == '-') {
              continue;
            } else {
              ESP_LOGD("scanner", "Ignoring non-product code");
              id(blink_ignored).execute();
              return;
            }
          }
          if (code.size() >= 4) {
            id(last_barcode).publish_state(code);
            id(send_scan).execute(code);
          }

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin: ${rgb_led_pin}
    num_leds: 1
    channel_colors: GRB
    chipset: WS2812
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: template
    id: last_barcode
    name: Last barcode
    icon: mdi:barcode-scan

binary_sensor:
  - platform: gpio
    id: atom_button
    name: Button
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_click:
      - min_length: 30ms
        max_length: 700ms
        then:
          - script.execute: print_receipt
      - min_length: 1s
        max_length: 6s
        then:
          - script.execute: sync_cart

script:
  # M14 commands from M5Stack's driver (qrcode_m14): trigger mode, decode
  # beep, and the minimum gap before the same code is reported again.
  - id: configure_scanner
    then:
      - uart.write: !lambda |- # trigger mode
          return {0x21, 0x61, 0x41, ${scan_mode}};
      - delay: 100ms
      - uart.write: [0x21, 0x63, 0x42, 0x01] # one beep per successful read
      - delay: 100ms
      - uart.write: [0x21, 0x64, 0x82, 0x05, 0xDC] # same code again after 1500 ms

  - id: send_scan
    mode: queued
    parameters:
      code: string
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: kroger_restock.scan_upc
                data:
                  upc: !lambda "return code;"
                  source: esphome
            # The real result comes back from HA via the feedback action.
          else:
            - script.execute:
                id: show_color
                r: 1.0
                g: 0.0
                b: 0.0

  - id: print_receipt
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: kroger_restock.print_list
                data:
                  target: receipt
            - script.execute: { id: show_color, r: 1.0, g: 1.0, b: 1.0 }
          else:
            - script.execute: { id: show_color, r: 1.0, g: 0.0, b: 0.0 }

  - id: sync_cart
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: kroger_restock.sync
            - script.execute: { id: show_color, r: 0.0, g: 1.0, b: 1.0 }
          else:
            - script.execute: { id: show_color, r: 1.0, g: 0.0, b: 0.0 }

  # Ignored QR / non-product code: amber, blinked twice (waiting is solid).
  - id: blink_ignored
    mode: restart
    then:
      - repeat:
          count: 2
          then:
            - light.turn_on:
                id: status_led
                brightness: 60%
                red: 1.0
                green: 0.55
                blue: 0.0
            - delay: 200ms
            - light.turn_off: status_led
            - delay: 200ms

  # Show a color for 1.5 s, then turn the LED off.
  - id: show_color
    mode: restart
    parameters:
      r: float
      g: float
      b: float
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: !lambda "return r;"
          green: !lambda "return g;"
          blue: !lambda "return b;"
      - delay: 1500ms
      - light.turn_off: status_led
