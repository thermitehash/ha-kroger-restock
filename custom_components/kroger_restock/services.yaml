scan_upc:
  fields:
    product_id:
      example: "0082415011716"
      selector:
        text:
    url:
      example: "https://www.kroger.com/p/item/0082415011716"
      selector:
        text:
    already_in_cart:
      default: false
      selector:
        boolean:
    upc:
      example: "049000028911"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box
    source:
      default: scan
      selector:
        select:
          translation_key: source
          options:
            - scan
            - shortcut
            - esphome
            - manual
            - assist
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

add_item:
  fields:
    already_in_cart:
      default: false
      selector:
        boolean:
    name:
      example: "Greek yogurt"
      selector:
        text:
    url:
      example: "https://www.kroger.com/p/item/0082415011716"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box
    source:
      default: manual
      selector:
        select:
          translation_key: source
          options:
            - scan
            - shortcut
            - esphome
            - manual
            - assist
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

resolve_item:
  fields:
    already_in_cart:
      default: false
      selector:
        boolean:
    item_id:
      required: true
      selector:
        text:
    product_id:
      required: true
      example: "0004900002891"
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

sync:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

readd_item:
  fields:
    item_id:
      required: true
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

check_stock:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

print_list:
  fields:
    target:
      default: both
      selector:
        select:
          translation_key: print_target
          options:
            - receipt
            - pdf
            - both
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

mark_cart_received:
  fields:
    missing:
      example: "eggs, milk"
      selector:
        text:
          multiple: true
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

check_cart_item:
  fields:
    item_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          translation_key: check_cart_action
          options:
            - confirm
            - push_again
            - remove
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

cart_check:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock

set_quantity:
  fields:
    item_id:
      selector:
        text:
    name:
      example: "Creamy Ranch"
      selector:
        text:
    quantity:
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 99
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: kroger_restock
