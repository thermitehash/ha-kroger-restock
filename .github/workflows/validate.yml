name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.6
      - run: ruff format --check .
      - run: ruff check .

  esphome:
    name: ESPHome configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Validate both scanner configs
        working-directory: esphome
        run: |
          sed "s|PASTE-YOUR-GENERATED-KEY-HERE|$(openssl rand -base64 32)|" \
            secrets.example.yaml > secrets.yaml
          esphome config kroger-scanner-atoms3.yaml > /dev/null
          esphome config kroger-scanner.yaml > /dev/null
      - name: Compile the AtomS3 firmware
        working-directory: esphome
        run: esphome compile kroger-scanner-atoms3.yaml

  housing:
    name: Housing (OpenSCAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q openscad
      - name: Render both parts
        working-directory: hardware/housing
        run: |
          openscad -o /tmp/housing.stl -D 'part="housing"' kroger_scanner_housing.scad
          openscad -o /tmp/cover.stl -D 'part="cover"' kroger_scanner_housing.scad
          test -s /tmp/housing.stl && test -s /tmp/cover.stl

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest tests -q --cov=custom_components.kroger_restock --cov-report=term-missing
