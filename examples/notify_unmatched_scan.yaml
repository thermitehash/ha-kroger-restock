# Tell your phone when a scanned barcode isn't in the Kroger catalog, so you
# can fix it with kroger_restock.resolve_item.
alias: Kroger Restock - unmatched scan
description: Notify when a scan can't be matched to a product.
mode: queued
triggers:
  - trigger: event
    event_type: kroger_restock_scanned
    event_data:
      result: unmatched
actions:
  - action: notify.mobile_app_your_phone   # change to your phone's notify action
    data:
      title: Barcode not found
      message: >-
        {{ trigger.event.data.upc }} isn't in the catalog. It's on the list as
        unmatched; open the list to fix it.
